name: Tests moteur

# Compile le moteur cvengine (sans Qt) et exécute ses tests sur les trois
# systèmes : round-trip des cartes .cvw, Verifie(), golden master de la
# simulation, génération aléatoire, « Copier vers... ». Le golden master doit
# être identique sur toutes les plateformes.
#
# Compile aussi l'application Qt (cvw) sur les trois systèmes et exécute le
# test de son interface (pilotage de Démo.cvw, sans affichage). Les chemins
# app/** déclenchent le workflow : une PR qui ne touche que l'application
# passe aussi par les jobs « Tests moteur » exigés sur main.

on:
  push:
    branches:
      - main
      - 'port/**'
    paths:
      - 'app/**'
      - 'engine/**'
      - 'tests/**'
      - 'maps/**'
      - 'tools/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/tests-moteur.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'engine/**'
      - 'tests/**'
      - 'maps/**'
      - 'tools/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/tests-moteur.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-moteur-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests moteur (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure (CMake preset ci, moteur seul)
        run: cmake --preset ci -DCV_APP=OFF

      - name: Build
        run: cmake --build --preset ci --parallel

      - name: Run tests (CTest)
        run: ctest --preset ci

      - name: Upload golden master differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-ecarts-${{ matrix.os }}
          path: build/ci/tests/sortie/golden
          if-no-files-found: ignore

  application:
    name: Application Qt (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies of Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libegl1 libxkbcommon-dev libfontconfig1-dev libfreetype-dev

      - name: Install Qt 6.8 LTS
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Configure (CMake preset ci, Qt obligatoire)
        run: cmake --preset ci -DCV_APP=ON

      - name: Build
        run: cmake --build --preset ci --parallel

      - name: Interface test (CTest)
        run: ctest --preset ci -R interface
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Interface test diagnostics (direct run)
        if: failure()
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: 1
          QT_DEBUG_PLUGINS: 1
        run: |
          exe=$(find build/ci/tests -name 'test_interface' -o -name 'test_interface.exe' | head -1)
          echo "Exécutable : $exe"
          CV_CARTE="$GITHUB_WORKSPACE/maps/Démo.cvw" "$exe" -v1 2>&1 | tail -150 || true
          echo "Code de sortie : ${PIPESTATUS[0]}"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-${{ matrix.os }}
          path: build/ci/tests/sortie/captures
          if-no-files-found: ignore

  fiches:
    name: Fiches .ui générées à jour
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check tools/dfm2ui.py output
        run: python3 tools/dfm2ui.py --verifie

  images:
    name: Images extraites des .dfm à jour
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check tools/extrait_images.py output
        run: python3 tools/extrait_images.py --verifie
