name: Tests moteur

# Compile le moteur cvengine (sans Qt) et exécute ses tests sur les trois
# systèmes : round-trip des cartes .cvw, Verifie(), golden master de la
# simulation, génération aléatoire, « Copier vers... ». Le golden master doit
# être identique sur toutes les plateformes.
#
# Compile aussi l'application Qt (cvw) sur les trois systèmes et exécute le
# test de son interface (pilotage de Démo.cvw, sans affichage).
#
# Noms des jobs par système (Linux, macOS, Windows) et non par image : ce sont les checks
# exigés, ils ne changent pas quand on passe à une nouvelle image.
#
# Les 10 jobs sont exigés sur main : ils doivent donc exister sur TOUTES les PR,
# sinon une PR qui ne touche que la documentation reste bloquée. Le workflow se
# lance sur chaque PR ; le job « changements » regarde si la PR touche un
# fichier dont dépendent la compilation ou les tests. Si ce n'est pas le cas,
# les jobs se terminent tout de suite sans rien compiler. Les jobs à matrice
# sautent leurs étapes plutôt que le job entier : un job à matrice sauté
# n'est pas déplié et ne produirait pas les noms de checks exigés. Si la
# détection échoue, tout est testé.
#
# Job « sanitizers » : toute la suite sous AddressSanitizer et UBSan, qui voient
# les lectures et écritures hors des tableaux que les autres jobs laissent passer.
# Une erreur d'UBSan arrête le test (halt_on_error), sinon elle ne ferait qu'un
# message.
# Les fuites ne sont pas cherchées (detect_leaks=0) : LSan, sous Linux seulement,
# signalerait aussi celles de Qt.
#
# Jobs de lint : tools/lint/requirements.txt fixe les versions. clang-tidy n'échoue que
# sur un constat absent de tools/lint/clang-tidy-reference.txt (tools/lint_cpp.py).

on:
  # Chaque semaine : voir les dérives des outils et des images sans attendre une PR
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches:
      - main
      - 'port/**'
    paths:
      - 'app/**'
      - 'engine/**'
      - 'tests/**'
      - 'maps/**'
      - 'tools/**'
      - 'src/**'
      - 'docs/**'
      - 'res/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.clang-tidy'
      - 'ruff.toml'
      - '.github/workflows/tests-moteur.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-moteur-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changements:
    name: Changements à tester
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filtre.outputs.code }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 2

      # Mêmes chemins que le déclencheur push (docs/ : test de l'aide ; res/ :
      # icônes de l'application). Sur une PR, HEAD est le commit de fusion :
      # HEAD^1..HEAD donne exactement les fichiers modifiés par la PR.
      - name: Fichiers dont dépendent la compilation et les tests
        id: filtre
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          fichiers=$(git diff --name-only HEAD^1 HEAD)
          echo "$fichiers"
          if grep -qE '^(app|engine|tests|maps|tools|src|docs|res)/|^CMakeLists\.txt$|^CMakePresets\.json$|^\.clang-tidy$|^ruff\.toml$|^\.github/workflows/tests-moteur\.yml$' <<< "$fichiers"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: Tests moteur (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: Linux, image: ubuntu-24.04}
          - {os: macOS, image: macos-26}
          - {os: Windows, image: windows-2025-vs2026}
    needs: changements
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 30

    steps:
      - name: Aucun fichier testé n'a changé
        if: needs.changements.outputs.code == 'false'
        run: echo "La PR ne touche ni le code, ni les tests, ni docs/ ou res/, rien à compiler."

      - name: Checkout repository
        if: needs.changements.outputs.code != 'false'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Configure (CMake preset ci, moteur seul)
        if: needs.changements.outputs.code != 'false'
        run: cmake --preset ci -DCV_APP=OFF

      - name: Build
        if: needs.changements.outputs.code != 'false'
        run: cmake --build --preset ci --parallel

      - name: Run tests (CTest)
        if: needs.changements.outputs.code != 'false'
        run: ctest --preset ci

      - name: Upload golden master differences
        if: failure() && needs.changements.outputs.code != 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: golden-ecarts-${{ matrix.os }}
          path: build/ci/tests/sortie/golden
          if-no-files-found: ignore

  application:
    name: Application Qt (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: Linux, image: ubuntu-24.04}
          - {os: macOS, image: macos-26}
          - {os: Windows, image: windows-2025-vs2026}
    needs: changements
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 30

    steps:
      - name: Aucun fichier testé n'a changé
        if: needs.changements.outputs.code == 'false'
        run: echo "La PR ne touche ni le code, ni les tests, ni docs/ ou res/, rien à compiler."

      - name: Checkout repository
        if: needs.changements.outputs.code != 'false'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Linux dependencies of Qt
        if: runner.os == 'Linux' && needs.changements.outputs.code != 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libegl1 libxkbcommon-dev libfontconfig1-dev libfreetype-dev

      - name: Install Qt 6.8 LTS
        if: needs.changements.outputs.code != 'false'
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.8.3'
          cache: true

      - name: Configure (CMake preset ci, Qt obligatoire)
        if: needs.changements.outputs.code != 'false'
        run: cmake --preset ci -DCV_APP=ON

      - name: Build
        if: needs.changements.outputs.code != 'false'
        run: cmake --build --preset ci --parallel

      - name: Interface test (CTest)
        if: needs.changements.outputs.code != 'false'
        run: ctest --preset ci -R interface
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Upload screenshots
        if: always() && needs.changements.outputs.code != 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: captures-${{ matrix.os }}
          path: build/ci/tests/sortie/captures
          if-no-files-found: ignore

  fiches:
    name: Fiches .ui générées à jour
    needs: changements
    if: ${{ !cancelled() && needs.changements.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check tools/dfm2ui.py output
        run: python3 tools/dfm2ui.py --verifie

  images:
    name: Images extraites des .dfm à jour
    needs: changements
    if: ${{ !cancelled() && needs.changements.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check tools/extrait_images.py output
        run: python3 tools/extrait_images.py --verifie

  sanitizers:
    name: ASan et UBSan (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: Linux, image: ubuntu-24.04}
          - {os: macOS, image: macos-26}
    needs: changements
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 60

    steps:
      - name: Aucun fichier testé n'a changé
        if: needs.changements.outputs.code == 'false'
        run: echo "La PR ne touche ni le code, ni les tests, ni docs/ ou res/, rien à compiler."

      - name: Checkout repository
        if: needs.changements.outputs.code != 'false'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Linux dependencies of Qt, and Ninja
        if: runner.os == 'Linux' && needs.changements.outputs.code != 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libegl1 libxkbcommon-dev libfontconfig1-dev libfreetype-dev

      - name: Install Ninja
        if: runner.os == 'macOS' && needs.changements.outputs.code != 'false'
        run: brew install ninja

      - name: Install Qt 6.8 LTS
        if: needs.changements.outputs.code != 'false'
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.8.3'
          cache: true

      - name: Configure (CMake preset asan)
        if: needs.changements.outputs.code != 'false'
        run: cmake --preset asan -DCV_APP=ON

      - name: Build
        if: needs.changements.outputs.code != 'false'
        run: cmake --build --preset asan --parallel

      # Pile : le calcul récursif des distances en demande plus sous ASan. Sous
      # Linux, les tests suivent « ulimit -s » (Windows et macOS : à l'édition de liens)
      - name: Run tests (CTest)
        if: needs.changements.outputs.code != 'false'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then ulimit -s 65536; fi
          ctest --preset asan
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  lint-outils:
    name: Lint Python et workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --quiet -r tools/lint/requirements.txt

      - name: Python (ruff)
        run: '"$RUNNER_TEMP/lint/bin/ruff" check tools'

      # En ligne (GH_TOKEN) : vérifie aussi que chaque SHA appartient bien à l'action citée
      - name: Workflows security (zizmor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/lint/bin/zizmor" --no-progress .github/workflows'

      # PATH : le shellcheck de requirements.txt, pas celui de la machine
      - name: Workflows (actionlint, shellcheck)
        run: PATH="$RUNNER_TEMP/lint/bin:$PATH" actionlint

  lint-cpp:
    name: Lint C++ (clang-tidy)
    needs: changements
    if: ${{ !cancelled() && needs.changements.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Linux dependencies of Qt, and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libegl1 libxkbcommon-dev libfontconfig1-dev libfreetype-dev

      - name: Install Qt 6.8 LTS
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.8.3'
          cache: true

      # clang-tidy lit compile_commands.json et les en-têtes générés : rien d'autre à compiler
      - name: Configure and generate headers
        run: |
          cmake -S . -B build/lint -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCV_APP=ON -DCV_TESTS=ON -DCMAKE_GLOBAL_AUTOGEN_TARGET=ON
          cmake --build build/lint --target autogen --parallel

      - name: Install clang-tidy
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --quiet -r tools/lint/requirements.txt

      - name: Run clang-tidy
        run: >
          python3 tools/lint_cpp.py --dossier build/lint --clang-tidy "$RUNNER_TEMP/lint/bin/clang-tidy"
          --sortie build/lint/constats-clang-tidy.txt

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: constats-clang-tidy
          path: build/lint/constats-clang-tidy.txt
          if-no-files-found: ignore
          retention-days: 14
