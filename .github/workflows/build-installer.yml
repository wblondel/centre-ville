name: Installeurs

# Compile l'application Qt 6 (cvw) depuis les sources sur les trois systèmes
# (phases 8 et 9 de PLAN_PORTAGE.md) et produit :
#   - Windows : installeur Inno Setup (inno-setup/inscvw95.iss) sur le
#     contenu de « cmake --install » (windeployqt, DLL de MSVC, aide) ;
#   - macOS   : image disque .dmg (Centre-Ville.app universel arm64 + x86_64,
#     macdeployqt, CPack) ;
#   - Linux   : AppImage x86_64 (linuxdeploy et linuxdeploy-plugin-qt), qui
#     copie les cartes d'exemple au premier lancement ;
#   - archives des sources.
# Le numéro de version est celui de project(VERSION) dans CMakeLists.txt.
# Sur un tag v<version> (release) ou v<version>-<suffixe> (pré-release, par
# exemple v6.0.0-rc1), les paquets, nommés d'après le tag, sont joints à une
# release GitHub dont les notes sont la section de la version dans
# CHANGELOG.md ; un tag qui ne correspond pas à la version arrête tout. Lancé
# à la main, le workflow ne produit que ses artefacts. Ni signature ni
# notarisation : avertissements de SmartScreen et de Gatekeeper.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: '6.8.*'

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      paquet: ${{ steps.version.outputs.paquet }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Version of CMakeLists.txt, tag and CHANGELOG.md
        id: version
        run: |
          cmake --preset ci -DCV_APP=OFF -DCV_TESTS=OFF > /dev/null
          version=$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build/ci/CMakeCache.txt)
          paquet=$version
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=${GITHUB_REF_NAME#v}
            case "$tag" in
              "$version"|"$version"-*) paquet=$tag ;;
              *) echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à project(VERSION $version) de CMakeLists.txt"; exit 1 ;;
            esac
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md n'a pas de section « ## [$version] »"; exit 1; }
          prerelease=false
          [ "$paquet" != "$version" ] && prerelease=true
          echo "Version $version, paquets $paquet, pré-release : $prerelease"
          { echo "version=$version"; echo "paquet=$paquet"; echo "prerelease=$prerelease"; } >> "$GITHUB_OUTPUT"

  sources:
    name: Archives des sources
    needs: version
    runs-on: ubuntu-latest
    env:
      PAQUET: ${{ needs.version.outputs.paquet }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Archive sources
        run: |
          git archive --format=tar.gz --prefix="Centre-Ville-$PAQUET/" -o "Centre-Ville-$PAQUET-sources.tar.gz" HEAD
          git archive --format=zip --prefix="Centre-Ville-$PAQUET/" -o "Centre-Ville-$PAQUET-sources.zip" HEAD

      - name: Upload sources
        uses: actions/upload-artifact@v4
        with:
          name: sources
          path: Centre-Ville-*-sources.*
          if-no-files-found: error

  windows:
    name: Installeur Windows
    needs: version
    runs-on: windows-latest
    env:
      PAQUET: ${{ needs.version.outputs.paquet }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6.8 LTS
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Configure (CMake preset ci, MSVC)
        run: cmake --preset ci -DCV_APP=ON -DCV_TESTS=OFF

      - name: Build
        run: cmake --build --preset ci --parallel

      - name: Install (windeployqt, MSVC runtime, help)
        # préfixe absolu : exigé par le script de déploiement de Qt (qt.conf)
        run: cmake --install build/ci --config Release --prefix "${{ github.workspace }}/build/installeur"

      - name: Check installed files
        shell: bash
        run: |
          for f in bin/cvw.exe bin/qt.conf bin/Qt6Core.dll bin/Qt6Widgets.dll bin/vcruntime140.dll \
                   plugins/platforms/qwindows.dll translations/qt_fr.qm \
                   bin/html/index.html bin/tutocv/index.html; do
            test -f "build/installeur/$f" || { echo "absent : $f"; exit 1; }
          done

      - name: Archive sources for the installer (cvw-src-win64.zip)
        run: git archive --format=zip -o cvw-src-win64.zip HEAD

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # Inno Setup 6 (32 bits, Program Files (x86)) ou 7 (édition 64 bits,
      # Program Files) : le script compile avec 6.3 et plus (essayé : 6.7.3, 7.1.0)
      - name: Compile installer (ISCC)
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "$env:ProgramFiles\Inno Setup *\ISCC.exe", "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $iscc) { Write-Error "ISCC.exe introuvable"; exit 1 }
          & $iscc.FullName "/DStaging=$PWD\build\installeur" inno-setup\inscvw95.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item inno-setup\output\inscvw95.exe "Centre-Ville-$env:PAQUET-Windows-x64-Setup.exe"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Centre-Ville-*-Windows-x64-Setup.exe
          if-no-files-found: error

  macos:
    name: Image disque macOS
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PAQUET: ${{ needs.version.outputs.paquet }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6.8 LTS
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      # Qt 6.8 : macOS 12 au minimum ; ses frameworks sont universels
      - name: Configure (CMake preset ci, universal binary)
        run: >
          cmake --preset ci -DCV_APP=ON -DCV_TESTS=OFF
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build
        run: cmake --build --preset ci --parallel

      # cpack installe Centre-Ville.app (macdeployqt, signature ad hoc) puis
      # crée l'image avec hdiutil, qui échoue parfois (« Resource busy ») sur
      # les machines de GitHub : jusqu'à trois essais. L'image porte le nom
      # de la version (CPack), renommée d'après le tag d'une pré-release.
      - name: Package (CPack DragNDrop)
        working-directory: build/ci
        run: |
          for essai in 1 2 3; do
            if cpack; then
              [ "$PAQUET" = "$VERSION" ] || mv "Centre-Ville-$VERSION-macOS.dmg" "Centre-Ville-$PAQUET-macOS.dmg"
              exit 0
            fi
            sleep 20
          done
          exit 1

      - name: Check disk image
        run: |
          volume=$(hdiutil attach -nobrowse -readonly "build/ci/Centre-Ville-$PAQUET-macOS.dmg" | tail -1 | cut -f3-)
          app="$volume/Centre-Ville.app"
          codesign --verify --deep --strict "$app"
          lipo -archs "$app/Contents/MacOS/Centre-Ville"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"
          for f in Contents/Resources/html/index.html Contents/Resources/tutocv/index.html \
                   Contents/Resources/translations/qtbase_fr.qm Contents/PlugIns/platforms/libqcocoa.dylib; do
            test -f "$app/$f" || { echo "absent : $f"; exit 1; }
          done
          test -f "$volume/Cartes/Démo.cvw"
          # Lancement : l'application doit tourner encore après 15 s (une
          # bibliothèque introuvable l'arrête aussitôt)
          "$app/Contents/MacOS/Centre-Ville" > lancement.log 2>&1 &
          pid=$!
          sleep 15
          if ! kill -0 $pid 2>/dev/null; then cat lancement.log; echo "::error::Centre-Ville.app ne démarre pas"; exit 1; fi
          kill $pid
          # Premier lancement : les cartes d'exemple sont copiées dans le dossier de Centre-Ville
          test -f "$HOME/Library/Application Support/Patquoi.fr/Centre-Ville/Démo.cvw"
          codesign --verify --deep --strict "$app"
          hdiutil detach "$volume"

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/ci/Centre-Ville-*-macOS.dmg
          if-no-files-found: error

  linux:
    name: AppImage Linux
    needs: version
    # Ubuntu 22.04 : glibc 2.35, l'AppImage tourne aussi sur les systèmes plus anciens que 24.04
    runs-on: ubuntu-22.04
    env:
      PAQUET: ${{ needs.version.outputs.paquet }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies of Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-12 xvfb libgl1-mesa-dev libegl1 libopengl0 libxkbcommon-dev libxkbcommon-x11-0 \
            libfontconfig1-dev libfreetype-dev libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install Qt 6.8 LTS
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Configure (CMake preset ci, GCC 12)
        run: cmake --preset ci -DCV_APP=ON -DCV_TESTS=OFF -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_CXX_COMPILER=g++-12

      - name: Build
        run: cmake --build --preset ci --parallel

      # Le crochet des cartes d'exemple est lu par l'AppRun de linuxdeploy
      - name: Install into AppDir
        run: |
          DESTDIR="$PWD/AppDir" cmake --install build/ci
          mkdir -p AppDir/apprun-hooks
          cp app/linux/apprun-hooks/centre-ville-cartes.sh AppDir/apprun-hooks/

      - name: Build AppImage (linuxdeploy, Qt plugin)
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          base=https://github.com/linuxdeploy
          wget -q "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -q "$base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy*.AppImage
          # cvw installé n'a plus le RPATH de la compilation : Qt par LD_LIBRARY_PATH
          export QMAKE="$QT_ROOT_DIR/bin/qmake" LD_LIBRARY_PATH="$QT_ROOT_DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export OUTPUT="Centre-Ville-$PAQUET-x86_64.AppImage" LDAI_OUTPUT="Centre-Ville-$PAQUET-x86_64.AppImage"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/fr.patquoi.CentreVille.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/centre-ville.png \
            --plugin qt --output appimage

      - name: Check AppImage
        run: |
          ./Centre-Ville-$PAQUET-x86_64.AppImage --appimage-extract > /dev/null
          for f in usr/bin/cvw usr/bin/qt.conf usr/bin/html/index.html usr/bin/tutocv/index.html \
                   usr/plugins/platforms/libqxcb.so usr/translations/qtbase_fr.qm \
                   usr/share/mime/packages/fr.patquoi.CentreVille.xml \
                   usr/share/centre-ville/cartes/Démo.cvw apprun-hooks/centre-ville-cartes.sh; do
            test -e "squashfs-root/$f" || { echo "absent : $f"; exit 1; }
          done
          grep -q centre-ville-cartes.sh squashfs-root/AppRun || { echo "AppRun ne lit pas le crochet des cartes"; exit 1; }

      # Lancement sous Xvfb, avec un dossier personnel vierge : l'application
      # tourne encore après 20 s et les 6 cartes d'exemple ont été copiées
      - name: Launch AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          export HOME="$RUNNER_TEMP/utilisateur"
          mkdir -p "$HOME"
          code=0
          timeout 20 xvfb-run -a "./Centre-Ville-$PAQUET-x86_64.AppImage" > lancement.log 2>&1 || code=$?
          if [ "$code" -ne 124 ]; then cat lancement.log; echo "::error::l'AppImage ne démarre pas (code $code)"; exit 1; fi
          ls "$HOME/.local/share/Patquoi.fr/Centre-Ville"
          test "$(ls "$HOME/.local/share/Patquoi.fr/Centre-Ville"/*.cvw | wc -l)" -eq 6

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: Centre-Ville-*-x86_64.AppImage
          if-no-files-found: error

  release:
    name: Release GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, sources, windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Notes : section « ## [<version>] » de CHANGELOG.md, jusqu'à la suivante
      - name: Release notes (CHANGELOG.md)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v titre="## [$VERSION]" 'index($0, titre)==1 { dedans=1; next } /^## \[/ { if (dedans) exit } dedans' CHANGELOG.md > notes.md
          test -s notes.md

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: paquets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: paquets/*
          name: Centre-Ville ${{ needs.version.outputs.paquet }}
          body_path: notes.md
          draft: false
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
