# Mises à jour groupées et mensuelles : chaque PR coûte un run complet de la CI. Les failles
# connues passent à part, par les mises à jour de sécurité de Dependabot. Une version doit
# avoir 7 jours : le temps qu'une version compromise soit repérée.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /tools/lint
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      lint:
        patterns: ["*"]
